<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع القمر - ناسا مباشرة</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#fff;padding:16px}
h1{font-size:20px;margin:0 0 4px} p.sub{color:#9aa7bd;font-size:13px;margin:0 0 16px}
.card{background:#151f33;border:1px solid #26324f;border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:#cbd5e1;margin:10px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px}
.row{display:flex;gap:10px} .row>div{flex:1}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#22c55e;color:#000;font-weight:800;font-size:16px;cursor:pointer;margin-top:14px}
button:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{background:#1e293b;border-radius:12px;padding:12px} .box small{color:#94a3b8;display:block;font-size:12px} .box b{font-size:20px}
.err{background:#7f1d1d;border:1px solid #ef4444;border-radius:12px;padding:12px;display:none;margin-top:12px}
.ok{background:#0f2a1a;border:1px solid #22c55e;border-radius:12px;padding:12px;display:none;margin-top:12px}
pre{background:#020617;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:300px;overflow:auto;display:none}
a{color:#7dd3fc;word-break:break-all;font-size:12px}
.muted{color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<h1>🌙 موقع القمر - من ناسا مباشرة DE441</h1>
<p class="sub">ما في بيانات وهمية. إذا فشل الاتصال، بيقول فشلت وما بيعرض شي.</p>

<div class="card">
<label>المدينة</label>
<select id="city"></select>
<div class="row">
<div><label>خط الطول Lon</label><input id="lon" value="35.5"></div>
<div><label>خط العرض Lat</label><input id="lat" value="33.9"></div>
<div><label>الارتفاع m</label><input id="alt" value="0"></div>
</div>
<label>التاريخ والوقت</label>
<input type="datetime-local" id="dt">
<button id="btn" onclick="getMoon()">جيب بيانات القمر من ناسا</button>
<div id="loading" class="muted" style="display:none;margin-top:10px">عم جيب من ناسا...</div>
<div id="err" class="err"></div>
<div id="ok" class="ok"></div>
</div>

<div id="results" style="display:none">
<div class="grid">
<div class="box"><small>الارتفاع EL</small><b id="v_el">-</b><small id="v_el_note"></small></div>
<div class="box"><small>السمت AZ / الاتجاه</small><b id="v_az">-</b><small id="v_az_dir"></small></div>
<div class="box"><small>الإضاءة Illumination</small><b id="v_ill">-</b></div>
<div class="box"><small>المسافة Range</small><b id="v_range">-</b></div>
<div class="box"><small>القدر الظاهري Magnitude</small><b id="v_mag">-</b></div>
<div class="box"><small>الاستطالة S-O-T</small><b id="v_sot">-</b></div>
<div class="box"><small>RA الظاهري</small><b id="v_ra">-</b></div>
<div class="box"><small>Dec الظاهري</small><b id="v_dec">-</b></div>
</div>
<div class="card" style="margin-top:12px">
<div class="muted" id="meta"></div>
<div style="margin-top:8px"><a id="link" href="#" target="_blank">رابط ناسا المستعمل - اضغط لتتأكد بنفسك</a></div>
<button onclick="toggleRaw()" style="background:#334155;color:#fff">عرض الناتج الخام من ناسا</button>
<pre id="raw"></pre>
</div>
</div>

<script>
var cities = [
["بيروت",35.5,33.9],["دمشق",36.29,33.51],["بغداد",44.36,33.31],["النجف",44.33,32.0],["كربلاء",44.02,32.61],["مكة",39.82,21.42],["المدينة",39.61,24.46],["قم",50.88,34.64],["طهران",51.39,35.69],["القاهرة",31.23,30.04],["عمان",35.93,31.95],["القدس",35.21,31.76],["إسطنبول",28.97,41.0],["دبي",55.30,25.20],["جاكرتا",106.84,-6.20],["كوالالمبور",101.68,3.13],["لندن",-0.12,51.50],["باريس",2.35,48.85],["نيويورك",-74.0,40.71]
];
var sel = document.getElementById('city');
cities.forEach(function(c,i){
  var o = document.createElement('option');
  o.value = i; o.textContent = c[0];
  sel.appendChild(o);
});
sel.onchange = function(){
  var c = cities[parseInt(sel.value)];
  document.getElementById('lon').value = c[1];
  document.getElementById('lat').value = c[2];
};
// default datetime now
(function(){
  var d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  document.getElementById('dt').value = d.toISOString().slice(0,16);
})();
function dirFromAz(az){
  var dirs = ["شمال","شمال شرق","شرق","جنوب شرق","جنوب","جنوب غرب","غرب","شمال غرب"];
  return dirs[Math.round(az/45)%8];
}
function toggleRaw(){
  var r = document.getElementById('raw');
  r.style.display = (r.style.display==='block'?'none':'block');
}
function showFail(msg){
  var e = document.getElementById('err');
  e.style.display='block'; e.textContent = 'فشلت - ' + msg;
  document.getElementById('results').style.display='none';
  document.getElementById('ok').style.display='none';
}
async function getMoon(){
  document.getElementById('err').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('ok').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('btn').disabled=true;
  try{
    var lon = document.getElementById('lon').value.trim();
    var lat = document.getElementById('lat').value.trim();
    var alt = document.getElementById('alt').value.trim() || '0';
    var dtVal = document.getElementById('dt').value;
    if(!dtVal){ throw new Error('اختار التاريخ والوقت'); }
    var d = new Date(dtVal);
    var utc = d.toISOString().slice(0,16).replace('T',' ');
    // Horizons needs YYYY-MM-DD HH:MM
    var url = "https://ssd.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='301'&EPHEM_TYPE='OBSERVER'&CENTER='coord@399'&SITE_COORD='" + lon + "," + lat + "," + alt + "'&START_TIME='" + utc + "'&STOP_TIME='" + utc + "'&STEP_SIZE='1m'&QUANTITIES='2,4,9,10,20,24'&CSV_FORMAT='YES'&CAL_FORMAT='BOTH'&ANG_FORMAT='DEG'&EXTRA_PREC='YES'";
    document.getElementById('link').href = url;
    document.getElementById('meta').textContent = 'الوقت المستعمل UTC: ' + utc + ' | الإحداثيات: ' + lon + ', ' + lat + ', ' + alt;
    var res = await fetch(url);
    if(!res.ok){ throw new Error('ناسا ما ردت - كود ' + res.status); }
    var j = await res.json();
    if(j.signature && j.signature.error){ throw new Error(j.signature.error); }
    var txt = j.result || '';
    document.getElementById('raw').textContent = txt;
    var s = txt.indexOf('$$SOE');
    var e = txt.indexOf('$$EOE');
    if(s===-1 || e===-1 || e<=s){ throw new Error('ناسا رجعت جواب ناقص'); }
    var block = txt.slice(s+5, e).trim();
    var lines = block.split('\n').filter(function(l){return l.trim().length>0});
    if(lines.length===0){ throw new Error('ما في سطر بيانات من ناسا'); }
    var parts = lines[0].split(',').map(function(x){return x.trim()});
    // Expected: date, RA, Dec, AZ, EL, Vmag, Sbright, Illum, Range, RangeRate, S-O-T
    if(parts.length < 11){ throw new Error('عدد الأعمدة ناقص من ناسا: ' + parts.length); }
    var ra = parts[1], dec = parts[2], az = parseFloat(parts[3]), el = parseFloat(parts[4]), mag = parts[5], ill = parts[7], range = parts[8], sot = parts[10];
    if(isNaN(az) || isNaN(el)){ throw new Error('أرقام غير صالحة من ناسا'); }
    document.getElementById('v_el').textContent = el.toFixed(4) + '°';
    document.getElementById('v_el_note').textContent = el > 0 ? 'فوق الأفق' : 'تحت الأفق';
    document.getElementById('v_az').textContent = az.toFixed(4) + '°';
    document.getElementById('v_az_dir').textContent = dirFromAz(az);
    document.getElementById('v_ill').textContent = ill + ' %';
    document.getElementById('v_range').textContent = Number(range).toLocaleString('en-US') + ' km';
    document.getElementById('v_mag').textContent = mag;
    document.getElementById('v_sot').textContent = sot + '°';
    document.getElementById('v_ra').textContent = ra;
    document.getElementById('v_dec').textContent = dec;
    document.getElementById('results').style.display='block';
    var ok = document.getElementById('ok');
    ok.style.display='block'; ok.textContent = 'تم - بيانات مباشرة من ناسا DE441';
  }catch(err){
    showFail(err.message || 'فشل الاتصال');
  }finally{
    document.getElementById('loading').style.display='none';
    document.getElementById('btn').disabled=false;
  }
}
</script>
</body>
</html>
