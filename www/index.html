<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقويم الصائغ - طرابلس لبنان</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2e8;font-family:Tahoma,Arial,sans-serif;color:#1a2e22;padding:12px 12px 80px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 6px}
.mut{color:#6b7a70;font-size:12px}.ok{color:#0a7a3a;font-weight:700}.err{color:#a11;background:#ffe8e8;border:1px solid #f5b5b5;padding:10px;border-radius:10px}
button{border:0;border-radius:999px;padding:9px 14px;background:#0f4a3a;color:#fff;font-weight:700;cursor:pointer}
button.off{background:#e9e4d6;color:#333}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{padding:10px;border:1px solid #ccc;border-radius:10px;font-family:inherit;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eee;padding:7px 4px;text-align:right}
th{background:#f7f3e6}td.num,span.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.badge{display:inline-block;background:#d9f2e3;color:#0a7a3a;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pill{background:#f7f3e6;border-radius:12px;padding:10px}
.pill b{display:block;font-size:12px;color:#6b7a70}.pill span{font-size:16px;font-weight:800}
</style>
</head>
<body>
<h1>تقويم الصائغ</h1>
<div class="mut">البيانات من السيرفر مباشرة · بلا بروكسي · بلا حساب محلي · الفشل بينقال فشل</div>
<div class="card">
<div class="row"><label>المدينة ID:</label><input id="cityId" value="1977" inputmode="numeric"><button onclick="loadCity()">جلب من السيرفر</button><button class="off" onclick="loadCities()">لائحة المدن</button></div>
<div style="margin-top:8px"><input id="citySearch" placeholder="ابحث: طرابلس، بيروت، النجف، الكويت..." style="width:100%" oninput="filterCities()"></div>
<div id="cityList" style="max-height:180px;overflow:auto;margin-top:8px"></div>
<div id="cityInfo" style="margin-top:10px"></div>
<div id="status" style="margin-top:8px"></div>
</div>

<div class="card"><div class="row">
<button id="tDay" onclick="show('day')">اليوم</button><button id="tMonth" class="off" onclick="show('month')">الشهر - إمساكية</button><button id="tYear" class="off" onclick="show('year')">السنة</button><button id="tExtra" class="off" onclick="show('extra')">إضافات</button>
</div></div>

<div id="viewDay" class="card"></div>
<div id="viewMonth" class="card" style="display:none"></div>
<div id="viewYear" class="card" style="display:none"></div>
<div id="viewExtra" class="card" style="display:none"></div>

<script>
let CITY=null, CITIES=[], CUR=null, CURMONTH=11;
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function num(v){return '<span class="num">'+esc(v)+'</span>'}
async function get(u){let r=await fetch(u,{headers:{'Accept':'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status+' - '+r.statusText); return await r.json();}
function show(t){['day','month','year','extra'].forEach(x=>{$('view'+x[0].toUpperCase()+x.slice(1)).style.display=(x===t?'block':'none'); $('t'+x[0].toUpperCase()+x.slice(1)).className=(x===t?'':'off')}); if(t==='month')renderMonth(); if(t==='year')renderYear();}
async function loadCities(){try{let d=await get('https://api.sayeghcalendar.com/cities'); CITIES=d; $('status').innerHTML='<span class="badge">تم جلب '+d.length+' مدينة</span>'; filterCities();}catch(e){$('status').innerHTML='<div class="err">فشل جلب المدن: '+esc(e.message)+'</div>'}}
function filterCities(){let q=($('citySearch').value||'').trim().toLowerCase(); let list=CITIES.filter(c=>!q||((c.city_en||'').toLowerCase().includes(q)||(c.city_ar||'').includes(q)||(c.country_en||'').toLowerCase().includes(q)||(c.country_ar||'').includes(q))).slice(0,60); $('cityList').innerHTML=list.map(c=>'<div style="padding:7px;border-bottom:1px solid #eee;cursor:pointer" onclick="pickCity('+c.id+')">'+esc(c.city_ar||c.city_en)+' - '+esc(c.city_en)+' - '+esc(c.country_ar||c.country_en)+' - ID '+num(c.id)+'</div>').join('')||'<div class="mut">اكبس لائحة المدن أولاً</div>'}
function pickCity(id){$('cityId').value=id; loadCity();}
async function loadCity(){let id=parseInt($('cityId').value,10); if(!id) return; $('status').innerHTML='جارٍ الجلب...'; try{let d=await get('https://api.sayeghcalendar.com/city/'+id); CITY=d; $('cityInfo').innerHTML='<b>'+esc(d.city_ar||d.city)+' - '+esc(d.city)+'</b> · '+esc(d.country_ar||d.country_en)+' · ID '+num(d.id)+' · خط عرض '+num(d.latitude)+' · خط طول '+num(d.longitude)+' · توقيت '+num(d.timezone)+' · قبلة '+num(d.qibla); $('status').innerHTML='<span class="badge">من السيرفر - api.sayeghcalendar.com/city/'+id+'</span> · '+new Date().toLocaleString('ar-LB'); // find today
let now=new Date(); let m=now.getMonth()+1, dy=now.getDate(); CURMONTH=m; let md=null; (d.months||[]).forEach(mm=>{if(mm.month===m) md=mm}); if(md){CUR=md.days.find(x=>x.day===dy)||md.days[0];} renderDay(); renderMonth(); renderYear();}catch(e){$('status').innerHTML='<div class="err">فشل: '+esc(e.message)+' - السيرفر قال فشل، ما في داتا مخترعة</div>'; $('cityInfo').innerHTML='';}}
function dayRow(l,v){return '<tr><td>'+l+'</td><td>'+num(v)+'</td></tr>'}
function renderDay(){if(!CUR) {$('viewDay').innerHTML='<div class="mut">اجلب مدينة أولاً</div>'; return;} let d=CUR; $('viewDay').innerHTML='<h2>'+esc(d.longDateAr||'')+'</h2><div class="mut">'+esc(d.longDateEn||'')+' · هجري '+esc(d.hijriDate)+' - '+esc(d.hijriMonthAr)+'</div><div class="row" style="margin:10px 0"><button onclick="prevDay()">◀ اليوم السابق</button><button onclick="nextDay()">اليوم التالي ▶</button><button class="off" onclick="loadCity()">اليوم</button></div><table>'+dayRow('السحر',d.saharTime)+dayRow('الإمساك',d.imsakTime)+dayRow('الفجر',d.dawnTime)+dayRow('الصبح',d.subhTime)+dayRow('نهاية فضيلة الصبح',d.subhFadhilatEndTime)+dayRow('الشروق',d.sunriseTime)+dayRow('الزوال',d.zawalTime)+dayRow('الظهر',d.dhuhrTime)+dayRow('نهاية فضيلة الظهر',d.dhuhrFadhilatEndTime)+dayRow('العصر 1',d.asrTime_1)+dayRow('العصر 2',d.asrTime_2)+dayRow('بداية فضيلة العصر',d.asrFadhilatBeginTime)+dayRow('نهاية فضيلة العصر',d.asrFadhilatEndTime)+dayRow('الغروب',d.sunsetTime)+dayRow('المغرب',d.maghrebTime)+dayRow('المغرب +15',d.maghreb_15min)+dayRow('المغرب 35°',d.maghreb_35deg)+dayRow('العشاء',d.ishaTime)+dayRow('بداية فضيلة العشاء',d.ishaFadhilatBeginTime)+dayRow('منتصف الليل',d.midnightTime)+dayRow('منتصف الليل الفلكي',d.astroMidnightTime)+dayRow('وقت القبلة',d.qiblaTime)+'</table><h3>كل التفاصيل</h3><div class="grid"><div class="pill"><b>فارسي</b><span>'+esc(d.farsiDate||'')+'</span></div><div class="pill"><b>قبطي</b><span>'+esc(d.copticDate||'')+'</span></div><div class="pill"><b>عبري</b><span>'+esc(d.hebrewDate||'')+'</span></div><div class="pill"><b>يولياني</b><span>'+esc(d.julianDate||'')+'</span></div><div class="pill"><b>طلوع القمر</b><span>'+esc(d.moonriseTime||'')+'</span></div><div class="pill"><b>غروب القمر</b><span>'+esc(d.moonsetTime||'')+'</span></div><div class="pill"><b>الأنواء</b><span>'+esc(d.anwaaName||'')+'</span></div><div class="pill"><b>المواسم</b><span>'+esc(d.mawasemName||'')+'</span></div><div class="pill"><b>البرج الحقيقي</b><span>'+esc(d.trueZodiacName||'')+'</span></div><div class="pill"><b>البرج الشائع</b><span>'+esc(d.commonZodiacName||'')+'</span></div></div>';}
function findDay(month,day){let mm=(CITY.months||[]).find(x=>x.month===month); if(!mm) return null; return mm.days.find(x=>x.day===day)||null;}
function prevDay(){if(!CUR) return; let dt=new Date(2026,CURMONTH-1,CUR.day); dt.setDate(dt.getDate()-1); CUR=findDay(dt.getMonth()+1,dt.getDate()); CURMONTH=dt.getMonth()+1; renderDay();}
function nextDay(){if(!CUR) return; let dt=new Date(2026,CURMONTH-1,CUR.day); dt.setDate(dt.getDate()+1); CUR=findDay(dt.getMonth()+1,dt.getDate()); CURMONTH=dt.getMonth()+1; renderDay();}
function renderMonth(){if(!CITY){$('viewMonth').innerHTML='اجلب مدينة أولاً'; return;} let sel=$('monthSel')?parseInt($('monthSel').value,10):CURMONTH; let mm=(CITY.months||[]).find(x=>x.month===sel); if(!mm){$('viewMonth').innerHTML='لا يوجد شهر '+sel; return;} let opts=(CITY.months||[]).map(x=>'<option value="'+x.month+'" '+(x.month===sel?'selected':'')+'>'+x.month+' - '+(x.days[0]?x.days[0].monthNameAr:'')+'</option>').join(''); $('viewMonth').innerHTML='<h2>إمساكية الشهر - '+esc(mm.days[0].monthNameAr)+' 2026</h2><select id="monthSel" onchange="renderMonth()">'+opts+'</select><div style="overflow:auto"><table><tr><th>اليوم</th><th>التاريخ</th><th>هجري</th><th>إمساك</th><th>صبح</th><th>شروق</th><th>ظهر</th><th>عصر 1</th><th>مغرب</th><th>عشاء</th></tr>'+mm.days.map(d=>'<tr><td>'+num(d.day)+'</td><td>'+num(d.date)+'</td><td>'+num(d.hijriDate)+'</td><td>'+num(d.imsakTime)+'</td><td>'+num(d.subhTime)+'</td><td>'+num(d.sunriseTime)+'</td><td>'+num(d.dhuhrTime)+'</td><td>'+num(d.asrTime_1)+'</td><td>'+num(d.maghrebTime)+'</td><td>'+num(d.ishaTime)+'</td></tr>').join('')+'</table></div>';}
function renderYear(){if(!CITY){$('viewYear').innerHTML='اجلب مدينة أولاً'; return;} $('viewYear').innerHTML='<h2>تقويم السنة - 2026</h2><div class="grid">'+(CITY.months||[]).map(mm=>{let f=mm.days[0],l=mm.days[mm.days.length-1]; return '<div class="pill" style="cursor:pointer" onclick="document.getElementById(\'monthSel\').value='+mm.month+';show(\'month\')"><b>'+esc(f.monthNameAr)+' - شهر '+num(mm.month)+'</b><span>'+mm.days.length+' يوم</span><div class="mut">من '+esc(f.hijriDate)+' إلى '+esc(l.hijriDate)+'</div></div>'}).join('')+'</div>';}
async function loadExtra(kind){let box=$('extraBox'); box.innerHTML='جارٍ الجلب...'; try{let url='',d; let cityEn=CITY?CITY.city:CITY; let countryEn=CITY?CITY.country_en:''; if(kind==='events'){url='https://api.sayeghcalendar.com/events/'+countryEn; d=await get(url);} else if(kind==='crescent'){url='https://api.sayeghcalendar.com/crescent/'+cityEn+'/'+CURMONTH; d=await get(url);} else if(kind==='tide'){url='https://api.sayeghcalendar.com/tidewave/'+countryEn; d=await get(url);} else if(kind==='moon'){let w=$('moonWhich').value; url='https://api.sayeghcalendar.com/moon/'+w; d=await get(url);} else if(kind==='hijri'){url='https://api.sayeghcalendar.com/hijri-calendar/2026'; d=await get(url);} box.innerHTML='<div class="mut">المصدر: '+esc(url)+'</div><div style="margin-top:8px">'+renderObj(d)+'</div>';}catch(e){box.innerHTML='<div class="err">غير متوفر من السيرفر: '+esc(e.message)+'</div>';}}
function renderObj(o){if(o==null) return '<span class="mut">-</span>'; if(Array.isArray(o)){if(o.length===0) return '<span class="mut">لا يوجد</span>'; if(o.every(x=>x==null||typeof x!=='object')) return o.map(x=>'<span class="badge" style="margin:2px">'+esc(x)+'</span>').join(' '); return '<div class="mut">'+o.length+' عنصر</div>'+o.slice(0,30).map(x=>'<div style="border:1px solid #eee;border-radius:10px;padding:8px;margin:6px 0">'+renderObj(x)+'</div>').join('');} if(typeof o==='object'){return '<table>'+Object.keys(o).map(k=>{let v=o[k]; let cell; if(v==null) cell='<span class="mut">-</span>'; else if(typeof v==='object') cell=renderObj(v); else cell=num(v); return '<tr><td style="font-weight:700;width:35%">'+esc(k)+'</td><td>'+cell+'</td></tr>';}).join('')+'</table>';} return '<span class="num">'+esc(o)+'</span>';}
$('viewExtra').innerHTML='<h2>إضافات - من السيرفر فقط</h2><div class="row"><button onclick="loadExtra(\'events\')">المناسبات</button><button class="off" onclick="loadExtra(\'crescent\')">الهلال</button><button class="off" onclick="loadExtra(\'tide\')">المد والجزر</button><button class="off" onclick="loadExtra(\'hijri\')">التقويم الهجري</button><select id="moonWhich"><option value="man">القمر - منازل man</option><option value="zod">القمر - أبراج zod</option><option value="true">القمر - حقيقي true</option></select><button class="off" onclick="loadExtra(\'moon\')">القمر</button></div><div id="extraBox" style="margin-top:10px"></div>';
loadCity();
</script>
</body>
</html>
